name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run typecheck
      - run: npm run release:check
      - run: npm run mcp:check
      - run: node --test --test-concurrency=1 tests/public-site.test.mjs tests/persistence-safety.test.mjs tests/agent-coordination.test.mjs tests/mcp-contract.test.mjs tests/e2e/mission-lifecycle.test.mjs tests/e2e/pagination.test.mjs
