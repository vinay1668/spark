  <rect class="purple" x="5" y="18" width="3" height="6" rx="1"/>
  <rect class="purple" x="24" y="18" width="3" height="6" rx="1"/>
  <rect class="eye" x="27" y="20" width="4" height="4" rx=".5"/>
  <rect class="head" x="7" y="7" width="18" height="11" rx="2"/>
